<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP SD Roadmap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230b3d91'/%3E%3Ctext x='256' y='320' text-anchor='middle' font-family='Arial' font-weight='800' font-size='190' fill='white'%3ESD%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#14213d;--muted:#5b6785;--line:#e3e8f2;--brand:#0b3d91;--brand2:#0e8a9a;--accent:#ff9f43;--ok:#1b9e5a;--chip:#eef3fb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#172038;--ink:#e8edf8;--muted:#9aa7c4;--line:#27324f;--brand:#6ea8ff;--brand2:#4fd1c5;--chip:#1f2a47}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#0b3d91,#0e8a9a);color:#fff;padding:20px 16px 24px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:52px;height:52px;flex:none}
h1{font-size:1.35rem;margin:0;line-height:1.2}
.sub{opacity:.85;font-size:.9rem}
.progress{margin-top:16px}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd86b,#ff9f43);transition:width .3s}
.pstats{display:flex;justify-content:space-between;font-size:.85rem;margin-top:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tools input{flex:1 1 180px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:10px 12px;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.phase{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.phase>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px}
.phase>summary::-webkit-details-marker{display:none}
.num{flex:none;width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:1.3rem}
.ph-main{flex:1;min-width:0}
.ph-title{font-weight:700}
.meta{font-size:.78rem;color:var(--muted)}
.lvl{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);margin-right:6px;font-weight:600}
.mini{width:46px;text-align:right;font-size:.8rem;font-weight:700;color:var(--brand)}
.phase.done .mini{color:var(--ok)}
.body{padding:0 14px 16px;border-top:1px solid var(--line)}
.goal{color:var(--muted);margin:12px 0}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
.topic{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.topic input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.topic.checked summary{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);padding:3px 9px;border-radius:8px;font:600 .8rem ui-monospace,Menlo,Consolas,monospace}
.box{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:.92rem}
.hide{display:none!important}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 0 40px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.acts button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
.tp{flex:1;min-width:0}
.tp summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
.tp summary::-webkit-details-marker{display:none}
.tp summary::after{content:"▾";color:var(--muted);flex:none}
.tp[open] summary::after{content:"▴"}
.learn{margin:8px 0 6px;font-size:.93rem}
.simple{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:.9rem;margin:6px 0 4px}
.qa{margin:8px 0 4px}
.q{border-top:1px dashed var(--line);padding:6px 0}
.q summary{cursor:pointer;font-weight:600;font-size:.9rem}
.q p{margin:6px 0;font-size:.9rem}
.rg{margin:8px 0;border:1px solid var(--line);border-radius:12px;padding:0 10px}
.rg summary{cursor:pointer;font-weight:700;padding:10px 0;font-size:.92rem}
.r{display:flex;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:.88rem;align-items:flex-start}
.r .chip{flex:none;min-width:96px;max-width:46%;word-break:break-word}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b3d91"/><stop offset="1" stop-color="#0e8a9a"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#ff9f43"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#fff" fill-opacity=".15"/><path d="M256 92a164 164 0 1 1-116 48" fill="none" stroke="url(#g2)" stroke-width="26" stroke-linecap="round"/><path d="M118 112l44 6-22 40z" fill="#ffd86b"/><text x="256" y="292" text-anchor="middle" font-family="Arial" font-weight="800" font-size="150" fill="#fff">SD</text><text x="256" y="352" text-anchor="middle" font-family="Arial" font-weight="600" font-size="34" letter-spacing="8" fill="#cfeff3">ROADMAP</text></svg>
    <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
  </div>
  <div class="progress">
    <div class="bar"><i id="fill"></i></div>
    <div class="pstats"><span id="count"></span><span id="weeks"></span></div>
  </div>
</div></header>

<main class="wrap">
  <div class="tools">
    <input id="q" type="search" placeholder="Search topics, T-codes, tables…">
    <div class="seg" id="seg">
      <button data-f="all" class="on">All</button><button data-f="todo">To do</button><button data-f="done">Done</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="acts">
    <button id="expand">Expand all</button>
    <button id="export">Export progress</button>
    <button id="reset">Reset</button>
  </div>
  <footer id="note"></footer>
</main>

<script>
const DATA = {"title": "SAP SD Learning Roadmap", "subtitle": "From Beginner to Advanced", "note": "T-codes are starting points; verify names and availability in your own system (ECC vs S/4HANA differ).", "phases": [{"id": 1, "icon": "📘", "title": "SAP Fundamentals", "level": "Beginner", "weeks": 2, "goal": "Understand what SAP is, how the system is built, and how to move around in it.", "topics": [{"name": "What is SAP and ERP?", "learn": "ERP is one system that runs a company's main work (sales, buying, stock, finance, production) using shared data. SAP is the biggest ERP software maker, and its products are made of modules that talk to each other.", "simple": "ERP is one shared notebook every department writes in, instead of each department keeping its own."}, {"name": "SAP ECC vs SAP S/4HANA", "learn": "ECC is the older SAP ERP. S/4HANA is the newer generation that runs on the HANA in-memory database, has a simpler data model, Fiori screens, and Business Partner as the single customer/vendor master. SAP is retiring ECC support, so companies are migrating.", "simple": "ECC is the old model. S/4HANA is the new, faster model with a simpler data structure."}, {"name": "SAP Architecture", "learn": "SAP is layered: users connect through the presentation layer (SAP GUI or Fiori), the application layer runs the business logic, and the database layer stores the data. Companies usually have Development, Quality and Production systems, and changes move between them as transport requests.", "simple": "Screen on top, brain in the middle, storage at the bottom."}, {"name": "SAP GUI Navigation", "learn": "SAP GUI is the classic desktop interface. You move around with T-codes typed in the command field, the menu, or favorites. Handy shortcuts: /n opens a new transaction, /o opens a new session, F4 gives value help, F1 gives field help.", "simple": "A T-code is a shortcut to a screen, like typing a web address."}, {"name": "Introduction to SAP Modules", "learn": "Modules are business areas: SD (sales), MM (purchasing and stock), FI (financial accounting), CO (controlling), PP (production), EWM (warehouse). They share master data and pass documents to each other.", "simple": "Each module is a department. Integration is how they hand work to each other."}, {"name": "Functional Consultant vs Technical Consultant", "learn": "A functional consultant understands the business process, configures SAP (SPRO), writes specs and tests. A technical consultant builds custom code, reports, interfaces and enhancements (ABAP, Fiori, integration).", "simple": "Functional decides what SAP should do. Technical builds the custom parts."}], "tcodes": ["SPRO", "SU3", "SE16N"], "practice": "Log in, customize your user settings, find your way around SPRO and the easy access menu, and write a one-page summary of ECC vs S/4HANA.", "milestone": "Explain ERP and the main SAP modules in 2 minutes without notes."}, {"id": 2, "icon": "🎯", "title": "SAP SD Fundamentals", "level": "Beginner", "weeks": 2, "goal": "Learn what SD does in a company and how a sale flows through documents.", "topics": [{"name": "What is SAP Sales and Distribution?", "learn": "SD is the module that handles selling, from customer inquiry to quotation, order, delivery and invoice. It controls prices, delivery dates, shipping and billing.", "simple": "SD covers everything from 'I want to buy' to 'here is your invoice'."}, {"name": "Role of SAP SD in an organisation", "learn": "SD is the revenue side of the company. It connects the sales team, the warehouse and finance: users enter orders, SD applies pricing and checks, and billing posts revenue to accounting.", "simple": "SD is where the company earns its money."}, {"name": "Order-to-Cash (O2C) Process", "learn": "O2C is the full cycle from a customer's order to the payment received: order, delivery, goods issue, invoice, then payment.", "simple": "Customer orders, we ship, we bill, they pay."}, {"name": "Sales Process Overview", "learn": "Pre-sales (inquiry, quotation), sales (order), shipping (delivery, picking, goods issue), billing (invoice) and payment. Each step creates a document that points back to the previous one.", "simple": "Five stages, each one leaving a document behind."}, {"name": "SAP SD Business Scenarios", "learn": "Real-life variants of the standard process: standard sale, free-of-charge delivery, returns, third-party (supplier ships), consignment, intercompany and cash sale.", "simple": "Same skeleton, different flavors."}, {"name": "Understanding Sales Document Flow", "learn": "Each document links to the one before it: Quotation, Order, Delivery, Invoice, Accounting document. The Document Flow button in any document shows this chain with statuses. The links are stored in table VBFA.", "simple": "A family tree of documents."}], "tcodes": ["VA03", "VL03N", "VF03"], "practice": "Pick one real or sample sales order and trace it by hand: order, delivery, invoice. Draw the document flow.", "milestone": "Draw the SD document flow from memory."}, {"id": 3, "icon": "🏢", "title": "Enterprise Structure", "level": "Beginner", "weeks": 2, "goal": "Know every organizational unit and how they are assigned to each other.", "topics": [{"name": "Company", "learn": "A Company groups one or more company codes for consolidated financial reporting. It is a finance-level unit.", "simple": "The parent that adds up the numbers of its company codes."}, {"name": "Company Code", "learn": "The smallest unit with its own balance sheet and profit and loss. Every financial posting belongs to a company code. A sales organisation is assigned to exactly one company code.", "simple": "One legal entity with its own books."}, {"name": "Sales Organisation", "learn": "The unit responsible for selling and for terms like pricing and delivery conditions, for example a country or region. Every sales document belongs to exactly one sales organisation.", "simple": "Who is doing the selling."}, {"name": "Distribution Channel", "learn": "The route products take to reach the customer, such as wholesale, retail or online. It lets you set different prices and rules per channel.", "simple": "How the product reaches the customer."}, {"name": "Division", "learn": "A grouping of products, for example pharma or devices. It lets you set pricing, responsibilities and reporting per product group.", "simple": "What product line is being sold."}, {"name": "Sales Area", "learn": "The combination of Sales Organisation + Distribution Channel + Division. Every sales document is created for one sales area, and customer and material master data must be extended to it.", "simple": "Who sells, through which route, what product line."}, {"name": "Sales Office", "learn": "A physical office that handles sales for a region. It is assigned to sales areas and used for responsibilities and reporting.", "simple": "The local branch office."}, {"name": "Sales Group", "learn": "A team of salespeople inside a sales office. Used for reporting and authorization.", "simple": "The sales team within the branch."}, {"name": "Plant", "learn": "A location where goods are produced, stored or shipped from. It is assigned to a company code, and the delivering plant is determined in the sales order.", "simple": "The factory or warehouse site that ships the goods."}, {"name": "Storage Location", "learn": "A place inside a plant where stock is physically kept, for example finished goods or returns. Stock is managed at storage-location level.", "simple": "A specific room or area inside the plant."}, {"name": "Shipping Point", "learn": "The place where deliveries are processed and goods leave, like a loading dock. Shipping points are assigned to plants, and each delivery is processed from one shipping point.", "simple": "The loading dock."}, {"name": "Enterprise Structure Assignments", "learn": "The links between the units: sales org to company code, distribution channel and division to sales org, plant to company code, sales org + channel to plant, shipping point to plant. Wrong or missing assignments cause order errors.", "simple": "The wiring that makes the structure work together."}], "tcodes": ["OVX5", "OX10", "OX09", "OVXD", "SPRO"], "practice": "Design an enterprise structure for a fictional company (2 company codes, 2 sales orgs, 3 plants) and map all assignments in a table.", "milestone": "Explain why a sales area is Sales Org + Distribution Channel + Division, and what each assignment does."}, {"id": 4, "icon": "🗂️", "title": "Master Data", "level": "Beginner", "weeks": 2, "goal": "Create and maintain the data every sales transaction depends on.", "topics": [{"name": "Business Partner", "learn": "In S/4HANA, Business Partner (T-code BP) is the single place to create customers and vendors. A partner gets roles such as sold-to party or FI customer, and each role unlocks the matching data screens.", "simple": "One person record, many roles."}, {"name": "Customer Master", "learn": "Customer data is kept at 3 levels: general data (name, address), company code data (reconciliation account, payment terms) and sales area data (pricing, shipping, partner functions).", "simple": "General info, finance info, sales info, all about one customer."}, {"name": "Material Master", "learn": "Product data is kept in views: basic data, sales org data, plant data (MRP, availability check), storage and accounting. SD mainly uses the sales and plant views.", "simple": "The product's ID card, with a page for each department."}, {"name": "Customer-Material Information Record", "learn": "Data specific to one customer and one material: the customer's own material number and description, delivery tolerances and minimum quantities. It lets orders be entered using the customer's own number.", "simple": "The customer's own nickname and rules for a product."}, {"name": "Customer Partner Functions", "learn": "The roles a customer can play in a sale: Sold-to, Ship-to, Bill-to and Payer. They are stored in the customer master and copied into the order, so goods can go to one place and the invoice to another.", "simple": "Who orders, who receives, who is invoiced, who pays."}, {"name": "Customer Hierarchy", "learn": "A tree of customers, for example headquarters and branches. It is used for pricing and rebates: a discount set at the head office can apply to all branches.", "simple": "An org chart for customers."}, {"name": "Condition Records", "learn": "A stored value for a condition type under a key, for example the price of material X for customer Y. Pricing reads these records when an order is created.", "simple": "A price tag with rules attached."}, {"name": "Material and Customer Classifications", "learn": "Grouping fields on the master data, such as customer pricing group or material pricing group, used to drive pricing and reporting without maintaining each item one by one.", "simple": "Labels that put similar customers or materials into the same bucket."}], "tcodes": ["BP", "XD01", "MM01", "VD51", "VK11", "VDH1N"], "practice": "Create a customer, a material, a customer-material info record and a price condition record, then use them in a test order.", "milestone": "Create a sales-area-ready customer and material end to end."}, {"id": 5, "icon": "🛒", "title": "Order-to-Cash (O2C)", "level": "Intermediate", "weeks": 3, "goal": "Run the complete business process and read the data behind it.", "topics": [{"name": "Inquiry", "learn": "The customer asks about price or availability. It is a non-binding document (VA11) that can later be copied into a quotation or order.", "simple": "'How much and can you deliver?'"}, {"name": "Quotation", "learn": "A binding offer with prices and a validity period (VA21). If the customer accepts it, it is copied into a sales order.", "simple": "A formal price offer."}, {"name": "Sales Order", "learn": "The customer's confirmed request (VA01). It holds sold-to and ship-to, materials, quantities, pricing and delivery dates, and is the core document of SD.", "simple": "The customer's confirmed shopping list."}, {"name": "Delivery Creation", "learn": "Starts shipping. A delivery (VL01N) is created from the order for items that are due, using the shipping point and delivery date, and it triggers picking.", "simple": "The instruction to the warehouse: 'send these items'."}, {"name": "Picking and Packing", "learn": "Picking takes goods from the storage location. Packing puts them into handling units (boxes, pallets). Both prepare the goods for goods issue.", "simple": "Pull the items off the shelf, then box them."}, {"name": "Post Goods Issue (PGI)", "learn": "PGI confirms the goods have left the warehouse. It reduces stock, posts cost of goods sold to finance (debit COGS, credit inventory) and updates the delivery status.", "simple": "The moment stock officially leaves the company."}, {"name": "Billing", "learn": "The invoice to the customer (VF01), created from the delivery or order. It posts to finance: debit customer receivable, credit revenue and tax.", "simple": "Sending the bill."}, {"name": "Accounting Document", "learn": "The finance document created automatically by billing (and PGI). It shows the debit and credit lines and can be opened from the document flow or with FB03.", "simple": "The bookkeeping entry behind the invoice."}, {"name": "Relevant SAP SD Transaction Codes", "learn": "Core T-codes: VA01/02/03 sales order, VA11 inquiry, VA21 quotation, VL01N/02N/03N delivery, VF01/02/03 billing, VK11 price records, VA05 list of orders, VL10 deliveries due, VF04 billing due list.", "simple": "Learn the V-codes by document: VA order, VL delivery, VF billing."}, {"name": "Important SAP SD Tables", "learn": "VBAK/VBAP order header and item, VBEP schedule lines, LIKP/LIPS delivery header and item, VBRK/VBRP billing header and item, VBFA document flow, KNA1/KNVV customer, MARA/MARC material. In S/4HANA the old status tables VBUK/VBUP were merged into the document tables.", "simple": "K is header, P is item; A is order, L is delivery, R is billing."}, {"name": "Document Flow and Status Management", "learn": "Document flow (VBFA) shows predecessor and successor documents. Status fields (not processed, partly, completely) show progress for delivery, billing and overall. Use them to find stuck orders.", "simple": "The progress tracker of every order."}], "tcodes": ["VA11", "VA21", "VA01", "VL01N", "VL02N", "VF01", "FB03", "VA03"], "tables": ["VBAK", "VBAP", "VBEP", "LIKP", "LIPS", "VBRK", "VBRP", "VBFA", "BKPF", "BSEG"], "practice": "Execute a full cycle: inquiry to accounting document. After each step open the document flow and check the tables in SE16N.", "milestone": "Explain O2C end to end and name the table/T-code at each step."}, {"id": 6, "icon": "⚙️", "title": "Sales Document Configuration", "level": "Intermediate", "weeks": 3, "goal": "Configure how sales documents behave.", "topics": [{"name": "Sales Document Types", "learn": "Defined in VOV8. A document type decides how a document behaves: order, return, quotation and so on. It controls number range, default delivery and billing types, blocks, and partner and text determination.", "simple": "The template that says what kind of document this is."}, {"name": "Item Categories", "learn": "Defined in VOV7. An item category controls how an item behaves: relevant for delivery and billing, pricing, schedule lines. Examples: TAN standard item, TAD service item, TAS third-party item.", "simple": "The rulebook for each line item."}, {"name": "Schedule Line Categories", "learn": "Defined in VOV6. They control delivery lines: whether availability check and MRP apply and whether the line is delivery relevant. Example: CP with MRP, CN without MRP.", "simple": "Decides if the system plans and reserves stock for the line."}, {"name": "Item Category Determination", "learn": "VOV4. The system picks the item category from document type + item category group of the material + usage + higher-level item category, so the same material can behave differently in different orders.", "simple": "A lookup table that picks the item rules automatically."}, {"name": "Schedule Line Determination", "learn": "The schedule line category is picked from the item category and the MRP type of the material, and it defaults the first schedule line of the item.", "simple": "A lookup that picks the delivery-line rules."}, {"name": "Number Ranges", "learn": "Number series for documents (VN01). Internal means the system assigns the number, external means the user enters it.", "simple": "The numbering sequence for documents."}, {"name": "Copy Control", "learn": "Rules for copying data when a document is created from another: order to order (VTAA), order to delivery (VTLA), delivery to billing (VTFL), order to billing (VTFA). They control what is copied, checks, and pricing handling.", "simple": "The rules for what travels from one document to the next."}, {"name": "Incompletion Procedures", "learn": "A list of required fields (OVA2). If something is missing, the document is flagged incomplete and cannot continue to delivery or billing until fixed. Report V.02 lists incomplete orders.", "simple": "The checklist that stops half-filled orders."}, {"name": "Partner Determination", "learn": "The system automatically fills partners (sold-to, ship-to, bill-to, payer, sales employee) from the customer master, based on the partner procedure assigned to the document type.", "simple": "Auto-filling who is who in the order."}], "tcodes": ["VOV8", "VOV7", "VOV6", "VOV4", "VOV5", "VN01", "VTAA", "VTLA", "VTFL", "VTFA", "OVA2"], "practice": "Create a custom order type (ZOR) with its own number range, item category, schedule line category, copy control to delivery and billing, and an incompletion procedure.", "milestone": "Configure and test a new document type from scratch."}, {"id": 7, "icon": "💰", "title": "Pricing Procedure", "level": "Intermediate", "weeks": 3, "goal": "Master the condition technique and build pricing procedures.", "topics": [{"name": "Condition Technique", "learn": "How SAP finds prices, discounts and taxes: condition table, then access sequence, then condition type, then pricing procedure. The system searches the condition records in order until it finds one.", "simple": "A search recipe for finding the right price."}, {"name": "Condition Tables", "learn": "They define the key fields under which condition records are stored, for example Customer + Material, or Material only. Stored as tables named A followed by a number.", "simple": "The key that decides how a price is looked up."}, {"name": "Access Sequences", "learn": "An ordered list of condition tables. The system searches the most specific first (customer + material), then more general ones. The first hit wins.", "simple": "Check the special price first, then fall back to the general price."}, {"name": "Condition Types", "learn": "One pricing element. Examples: PR00 price, K007 customer discount, KF00 freight. A condition type defines if it is a percentage or amount, header or item, discount or surcharge.", "simple": "One line on the price sheet."}, {"name": "Condition Records", "learn": "A stored value for a condition type under a key, for example the price of material X for customer Y. Pricing reads these records when an order is created.", "simple": "A price tag with rules attached."}, {"name": "Pricing Procedures", "learn": "The ordered calculation sheet: a list of condition types with steps, subtotals, calculation rules and account keys. It decides the final price.", "simple": "The full price calculation, line by line."}, {"name": "Pricing Procedure Determination", "learn": "OVKK. The pricing procedure is chosen from sales area + customer pricing procedure + document pricing procedure.", "simple": "Picks which price sheet to use for this order."}, {"name": "Condition Exclusion", "learn": "Stops conditions from combining so that only one, often the best, applies. Example: use only the best of several discounts.", "simple": "Avoids stacking discounts that should not stack."}, {"name": "Discounts and Surcharges", "learn": "Conditions with a negative (discount) or positive (surcharge) value, either percentage or fixed amount, on header or item level.", "simple": "Take something off or add something on."}, {"name": "Taxes", "learn": "Tax conditions are found through tax determination based on country and the tax classification of the customer and material. They are posted to tax accounts in finance.", "simple": "The system works out the right tax automatically."}, {"name": "Account Keys", "learn": "Tags on condition types in the pricing procedure (for example ERL revenue, ERS sales deductions, ERF freight). Account determination (VKOA) uses them to find the GL account.", "simple": "A label that tells finance which account the amount goes to."}, {"name": "Pricing Analysis", "learn": "A tool in the order item (Conditions, then Analysis) that shows why a price was or was not found: which tables were checked, which records, and any exclusions. Your first stop for a wrong price.", "simple": "A detective report on a price."}], "tcodes": ["V/03", "V/07", "V/06", "V/08", "OVKK", "VK11", "VK13"], "tables": ["KONH", "KONP", "T683", "T685"], "practice": "Build a custom pricing procedure with base price, customer discount, freight, and tax. Then use pricing analysis on an order to explain every condition line.", "milestone": "Debug a wrong price using pricing analysis only."}, {"id": 8, "icon": "🚚", "title": "Shipping and Delivery", "level": "Intermediate", "weeks": 2, "goal": "Control how goods are determined, scheduled, picked, packed and issued.", "topics": [{"name": "Delivery Types", "learn": "Defined in OVL2. A delivery type controls delivery behavior, for example LF standard delivery and LR return delivery, with its number range and defaults.", "simple": "The template for a delivery document."}, {"name": "Shipping Point Determination", "learn": "Shipping point is found from the customer's shipping condition + the material's loading group + the delivering plant.", "simple": "Which dock sends this order."}, {"name": "Route Determination", "learn": "A route is found from country/region of departure + transportation group of the material + shipping condition + destination. It drives transit times.", "simple": "The path the shipment will take."}, {"name": "Delivery Scheduling", "learn": "The system works backward from the requested delivery date using transit time, loading time, pick/pack time and material availability to find when to start shipping.", "simple": "Counting backward from the customer's date to know when to ship."}, {"name": "Picking and Packing", "learn": "Picking takes goods from the storage location. Packing puts them into handling units (boxes, pallets). Both prepare the goods for goods issue.", "simple": "Pull the items off the shelf, then box them."}, {"name": "Batch Determination", "learn": "Automatically selects the batch based on rules, such as earliest expiry first. Very important in pharma and food.", "simple": "Auto-pick the right lot, like the oldest first."}, {"name": "Handling Units", "learn": "Physical packages such as boxes or pallets, created with packing materials and tracked with an identification number. They can contain materials or other handling units.", "simple": "Tracked boxes and pallets."}, {"name": "PGI", "learn": "Post Goods Issue confirms the goods left. It reduces stock, posts cost of goods sold and updates the delivery status.", "simple": "The moment stock officially leaves."}, {"name": "PGI Reversal", "learn": "VL09. Cancels a goods issue, reversing stock and accounting postings so the delivery can be changed. It is only possible if the delivery is not billed yet.", "simple": "An undo for goods issue."}], "tcodes": ["OVL2", "VL01N", "VL02N", "VL09", "VL10"], "practice": "Run deliveries with different shipping conditions, test scheduling dates, pack into handling units, post PGI, then reverse it.", "milestone": "Explain how shipping point, route and delivery dates are calculated."}, {"id": 9, "icon": "🧾", "title": "Billing and Account Determination", "level": "Intermediate", "weeks": 3, "goal": "Handle invoicing and understand how SD posts into Finance.", "topics": [{"name": "Billing Types", "learn": "Defined in VOFA. They define billing behavior, for example F2 invoice, G2 credit memo, L2 debit memo, S1 cancellation, with number ranges and posting rules.", "simple": "The template for each kind of bill."}, {"name": "Invoice Creation", "learn": "Created one by one with VF01 or in bulk with a billing run (VF04/VF06), from a delivery or an order. Pricing is copied or redetermined depending on copy control.", "simple": "Turning deliveries into bills."}, {"name": "Credit Memo", "learn": "Reduces what the customer owes, for example for a price error or damaged goods. It is created from a credit memo request and billed with a credit memo billing type.", "simple": "Giving money back on a bill."}, {"name": "Debit Memo", "learn": "Increases what the customer owes, for example when they were undercharged. It is created from a debit memo request.", "simple": "Charging extra on a bill."}, {"name": "Pro Forma Invoice", "learn": "A document for customs or preview purposes. It is not an accounting document and posts nothing to finance.", "simple": "A preview invoice that is not a real bill."}, {"name": "Billing Blocks", "learn": "Stop invoicing until a reason is resolved, such as a price check. Set in the order and released in VA02 or from the list of documents blocked for billing (V.23). A posting block on the invoice itself is a different block, released with VFX3.", "simple": "A hold on the invoice."}, {"name": "Billing Cancellation", "learn": "VF11. Reverses an invoice with a cancellation document and reverses the accounting, so billing can be redone.", "simple": "Undo the invoice."}, {"name": "Revenue Account Determination", "learn": "The system finds the GL revenue account through condition records in VKOA based on chart of accounts, sales org, account assignment groups of customer and material, and the account key.", "simple": "How SAP knows which revenue account to post to."}, {"name": "VKOA", "learn": "The T-code to maintain account determination records. The common error 'no account determined' usually means a missing VKOA record for that combination.", "simple": "The map between price conditions and GL accounts."}, {"name": "SD-FI Integration", "learn": "Billing and PGI post to accounting. Credit management, tax and account determination connect SD to FI.", "simple": "Sales results flow into the books."}], "tcodes": ["VOFA", "VF01", "VF04", "VF11", "VKOA", "FBL5N"], "practice": "Bill, cancel, issue credit and debit memos, apply a billing block, and trace the accounting entries for each.", "milestone": "Fix a 'no account determined' error using VKOA."}, {"id": 10, "icon": "🔀", "title": "Special Business Processes", "level": "Advanced", "weeks": 4, "goal": "Configure and run the non-standard scenarios real clients need.", "topics": [{"name": "Third-Party Sales", "learn": "You sell, but your supplier ships directly to the customer. The order creates a purchase requisition and purchase order, the supplier invoice is received, and then you bill your customer.", "simple": "You are the middleman and never touch the goods."}, {"name": "Intercompany Sales", "learn": "One company code takes the order and another delivers. An internal intercompany invoice is created between them.", "simple": "Two branches of the same group sell to each other."}, {"name": "Consignment Process", "learn": "Your stock sits at the customer's site but still belongs to you until it is used. Steps: fill-up, issue, return, pick-up. Billing happens on issue.", "simple": "Goods on loan: you only bill when the customer takes them."}, {"name": "Make-to-Order", "learn": "Production starts only after the customer order, and the stock is tied to that sales order (special stock). Used for custom products.", "simple": "Make it only when someone orders it."}, {"name": "Make-to-Stock", "learn": "Goods are produced or bought ahead of demand and sold from stock. This is the standard process.", "simple": "Make it first, sell it later."}, {"name": "Cash Sales", "learn": "The customer pays and takes the goods immediately. Order, delivery and invoice are created in one go with cash payment.", "simple": "Like buying at a shop counter."}, {"name": "Rush Orders", "learn": "The delivery is created automatically when the order is saved. Billing is done separately. Used for same-day shipping.", "simple": "Order saved means delivery created."}, {"name": "Free Goods", "learn": "Bonus items given free, for example buy 10 get 1 free. They are determined through condition records and can be inclusive or exclusive.", "simple": "Buy more, get extra for free."}, {"name": "Returns Management", "learn": "The customer returns goods. Return order, returns delivery, goods receipt, then credit memo, with return reasons and optional blocks.", "simple": "The reverse of a normal sale."}, {"name": "Contracts", "learn": "A long-term agreement (VA41) with a customer, based on quantity or value. Release orders refer to the contract and consume it.", "simple": "A deal made once, then orders drawn from it."}, {"name": "Scheduling Agreements", "learn": "An agreement (VA31) with a fixed delivery schedule over time, common in automotive. Delivery lines are created automatically.", "simple": "A standing order with planned dates."}, {"name": "Credit Management", "learn": "Limits the risk per customer by blocking orders or deliveries when the credit limit is exceeded. In S/4HANA this uses SAP Credit Management (FSCM, UKM_BP).", "simple": "A spending limit for each customer."}], "tcodes": ["VA41", "VA31", "VA01", "VL01N", "VF01", "UKM_BP"], "practice": "Pick three scenarios (third-party, returns, consignment). For each, write the process steps, the configuration, and the accounting impact, then test them.", "milestone": "Compare 3 special processes: document flow, configuration and FI/MM impact."}, {"id": 11, "icon": "🔗", "title": "Integration with Other Modules", "level": "Advanced", "weeks": 2, "goal": "See how SD connects to the rest of SAP.", "topics": [{"name": "SD-MM Integration", "learn": "The availability check and stock reduction at PGI come from MM. Third-party sales and returns also create MM documents. SD creates demand, MM provides stock.", "simple": "Sales needs to know what is in stock."}, {"name": "SD-FI Integration", "learn": "Billing and PGI post to accounting. Credit management, tax and account determination connect SD to FI.", "simple": "Sales results flow into the books."}, {"name": "SD-PP Integration", "learn": "Sales orders create requirements for MRP and production. In make-to-order, production is linked to the sales order and delivery follows production.", "simple": "Orders tell production what to make."}, {"name": "SD-EWM Integration", "learn": "Deliveries are passed to Extended Warehouse Management, which creates warehouse tasks for picking and packing. The goods issue then updates SD.", "simple": "The warehouse system does the picking, SD stays updated."}, {"name": "SD-CO Integration", "learn": "Billing flows into profitability analysis (CO-PA) and cost objects, so revenue and costs can be analyzed by customer, product or region.", "simple": "Shows how profitable each sale was."}], "tcodes": ["MD04", "MMBE", "FBL5N", "KE30", "CO11N"], "practice": "Follow one order through stock (MM), accounting (FI), production (PP) and profitability (CO) and list the integration points.", "milestone": "Draw an integration map of SD with MM, FI, PP, EWM and CO."}, {"id": 12, "icon": "🧰", "title": "Technical Knowledge", "level": "Advanced", "weeks": 2, "goal": "Gain the technical skills to troubleshoot and analyze like a senior consultant.", "topics": [{"name": "SAP Tables and Data Dictionary", "learn": "Data is stored in tables with fields. The Data Dictionary (SE11) defines tables, fields, data elements and domains. Use SE11 for structure and SE16N to see the data.", "simple": "SE11 shows the design, SE16N shows the content."}, {"name": "SE16N", "learn": "The data browser for viewing table contents with filters. In production it is usually display only.", "simple": "Excel-style viewer for SAP tables."}, {"name": "IDocs", "learn": "The standard SAP format for exchanging data with other systems, such as EDI orders. Message type ORDERS creates sales orders. Check status in WE02 and reprocess failed ones with BD87.", "simple": "A standard envelope for sending business data between systems."}, {"name": "Batch jobs", "learn": "Programs scheduled to run in the background, such as billing runs or reports. Schedule in SM36, monitor in SM37 and check the job log when a job is cancelled.", "simple": "Tasks SAP runs by itself on a timer."}, {"name": "Understanding Data Flow Between Documents", "learn": "Know which data moves from one document to the next: customer, order, delivery, billing, accounting. Use VBFA, copy control and table fields to trace it.", "simple": "Follow the data from the order to the books."}], "tcodes": ["SE11", "SE16N", "WE02", "WE19", "BD87", "SM36", "SM37"], "practice": "Find the tables behind a sales order, inspect an order IDoc in WE02, and schedule and monitor a background job.", "milestone": "Debug a failed IDoc and a failed batch job.", "reference": [["Tables", "Sales documents", [["VBAK", "Sales document header (order, quotation, contract, return)"], ["VBAP", "Sales document item"], ["VBEP", "Schedule lines (confirmed qty and dates)"], ["VBKD", "Business data: payment terms, incoterms, PO number, pricing date"], ["VBPA", "Partners of the document (sold-to, ship-to, bill-to, payer)"], ["VBFA", "Document flow: predecessor and successor documents"], ["VBUK / VBUP", "Status header / item (ECC). In S/4HANA the status fields moved into VBAK/VBAP, LIKP/LIPS, VBRK"], ["VBUV", "Incompletion log ypes"], ["VOV7", "Define item categories"], ["VOV6", "Define schedule line categories"], ["VOV4", "Assign item categories (determination)"], ["VOV5", "Assign schedule line categories (determination)"], ["VN01", "Number ranges for sales documents"], ["VTAA / VTLA / VTFL / VTFA", "Copy control: order-order / order-delivery / delivery-billing / order-billing"], ["OVA2", "Incompletion procedures"], ["VOPA", "Partner determination procedures"], ["OVL2", "Define delivery types"], ["OVLP", "Define delivery item categories"], ["VOFA", "Define billing types"], ["VKOA", "Revenue account determination"], ["NACE", "Output determination configuration"], ["OVA8", "Automatic credit control (ECC)"], ["OB45", "Define credit control area (ECC)"]]], ["Tcodes", "Output", [["VV31 / VV32 / VV33", "Create / change / display output condition record for sales documents"], ["NACE", "Output types and determination setup"], ["VF31", "Billing output (print or send invoices)"], ["VL71", "Delivery output (print or send delivery notes)"]]], ["Tcodes", "Technical and analysis", [["SE11", "Data Dictionary"], ["SE16 / SE16N", "Data browser"], ["SE17", "General table display"], ["SE37", "Function module test"], ["SE38", "ABAP editor and program execution"], ["SE80", "Object navigator"], ["SE93", "Maintain transaction codes"], ["SE24", "Class builder"], ["SE91", "Message maintenance"], ["SM30 / SM31", "Table maintenance"], ["SQVI", "QuickViewer: build quick reports"], ["SQ01", "SAP Query"], ["SM36 / SM37", "Schedule background job / monitor background jobs"], ["SM35", "Batch input sessions"], ["SM12", "Lock entries"], ["SM13", "Update requests (failed updates)"], ["SM21", "System log"], ["SM50 / SM66", "Process overview (local / system wide)"], ["SM58 / SM59", "Transactional RFC errors / RFC destinations"], ["SLG1", "Application log"], ["ST22", "ABAP dumps"], ["ST05", "SQL trace"], ["SU01 / SU53", "User maintenance / last authorization failure"], ["PFCG", "Role maintenance"], ["SE01 / SE09 / SE10", "Transport organizer"], ["STMS", "Transport management system"], ["SCC4", "Client settings"], ["SCU3", "Table change logs"], ["LSMW", "Legacy System Migration Workbench"], ["LTMC", "Migration cockpit (S/4HANA)"], ["/h", "Switch on debugger (type in command field)"]]], ["Tcodes", "IDoc and integration", [["WE02 / WE05", "Display IDocs / IDoc lists"], ["WE09", "Search IDocs by content"], ["WE19", "IDoc test tool"], ["WE20", "Partner profiles"], ["WE21", "Ports"], ["WE30 / WE31", "IDoc types / segments"], ["BD87", "IDoc status monitor and reprocessing"], ["BD64", "Distribution model"], ["BD54", "Logical systems"], ["SALE", "ALE configuration"], ["BAPI", "BAPI explorer"], ["SWO1", "Business object builder"]]], ["Codes", "SD document categories (VBTYP)", [["A", "Inquiry"], ["B", "Quotation"], ["C", "Sales order"], ["E", "Scheduling agreement"], ["G", "Contract"], ["H", "Returns"], ["I", "Order without charge"], ["J", "Delivery"], ["K", "Credit memo request"], ["L", "Debit memo request"], ["M", "Invoice"], ["N", "Invoice cancellation"], ["O", "Credit memo"], ["P", "Debit memo"], ["R", "Goods movement"], ["T", "Returns delivery for order"], ["U", "Pro forma invoice"]]], ["Codes", "Standard sales document types", [["IN", "Inquiry"], ["QT", "Quotation"], ["OR", "Standard order"], ["SO", "Rush order"], ["CS", "Cash sale"], ["RE", "Returns"], ["CR", "Credit memo request"], ["DR", "Debit memo request"], ["WK1", "Quantity contract"], ["WK2", "Value contract"], ["LP", "Scheduling agreement"], ["LZ", "Scheduling agreement with delivery schedule"], ["KB", "Consignment fill-up"], ["KE", "Consignment issue"], ["KR", "Consignment returns"], ["KA", "Consignment pick-up"]]], ["Codes", "Standard item categories", [["TAN", "Standard item"], ["TAD", "Service item"], ["TAS", "Third-party item"], ["TANN", "Free-of-charge item"], ["REN", "Returns item"]]], ["Codes", "Delivery and billing types", [["LF", "Outbound delivery"], ["LR", "Returns delivery"], ["LO", "Delivery without order reference"], ["F2", "Invoice (delivery related)"], ["F1", "Invoice (order related)"], ["G2", "Credit memo"], ["L2", "Debit memo"], ["S1", "Cancellation of invoice"], ["S2", "Cancellation of credit memo"], ["F5", "Pro forma invoice (order related)"], ["F8", "Pro forma invoice (delivery related)"], ["IV", "Intercompany billing"]]], ["Codes", "Common condition types", [["PR00", "Price"], ["K004", "Material discount"], ["K005", "Customer/material discount"], ["K007", "Customer discount"], ["RA01", "Percentage discount from net (header)"], ["KF00", "Freight"], ["SKTO", "Cash discount"], ["MWST", "Output tax"], ["VPRS", "Cost (moving average / standard)"]]], ["Codes", "Partner functions", [["SP", "Sold-to party"], ["SH", "Ship-to party"], ["BP", "Bill-to party"], ["PY", "Payer"]]], ["Codes", "Common movement types", [["601", "Goods issue for delivery"], ["602", "Reversal of goods issue for delivery"], ["651", "Goods receipt for returns delivery, blocked stock"], ["653", "Goods receipt for returns delivery, unrestricted"], ["631", "Consignment fill-up"], ["633", "Consignment issue"], ["635", "Consignment pick-up"], ["637", "Consignment returns"], ["101", "Goods receipt for purchase order"]]], ["Codes", "Output types and key fields", [["BA00", "Order confirmation"], ["AN00", "Quotation"], ["LD00", "Delivery note"], ["RD00", "Invoice"], ["VBELN", "Document number"], ["POSNR", "Item number"], ["MATNR", "Material number"], ["KUNNR", "Customer number"], ["AUART", "Sales document type"], ["PSTYV", "Item category"], ["FKART", "Billing type"], ["LFART", "Delivery type"], ["VKORG / VTWEG / SPART", "Sales org / distribution channel / division"], ["WERKS / LGORT", "Plant / storage location"], ["VSTEL", "Shipping point"], ["ETENR", "Schedule line number"], ["BSTNK", "Customer PO number"], ["KSCHL", "Condition type"]]], ["Codes", "IDocs, BAPIs and enhancements", [["ORDERS / ORDERS05", "Incoming purchase order from customer, creates a sales order"], ["ORDRSP", "Order confirmation to customer"], ["DESADV / DELVRY03", "Delivery notification (advance shipping notice)"], ["INVOIC / INVOIC02", "Invoice to customer"], ["BAPI_SALESORDER_CREATEFROMDAT2", "Create sales order"], ["BAPI_SALESORDER_CHANGE", "Change sales order"], ["BAPI_SALESORDER_SIMULATE", "Simulate sales order (pricing check)"], ["BAPI_OUTB_DELIVERY_CREATE_SLS", "Create outbound delivery from sales order"], ["BAPI_OUTB_DELIVERY_CONFIRM_DEC", "Confirm delivery and post goods issue"], ["BAPI_BILLINGDOC_CREATEMULTIPLE", "Create billing documents"], ["MV45AFZZ", "User exit include for sales order processing"], ["RV60AFZZ", "User exit include for billing"], ["VOFM routines", "Custom requirements and formulas in pricing, copy control, etc."]]]]}, {"id": 13, "icon": "🧑‍💼", "title": "Interview Preparation", "level": "Advanced", "weeks": 2, "goal": "Turn knowledge into interview-ready answers.", "topics": [{"name": "Basic SAP SD Interview Questions", "learn": "Be ready to define terms like sales area, document types, item categories, pricing and O2C in one or two sentences, with a short example.", "simple": "Short, clear definitions with one example.", "qa": [["What is SAP SD?", "SD is the module that manages the selling process: inquiry, quotation, order, delivery, billing, pricing and shipping. It integrates with MM for stock and FI for accounting."], ["Explain Order-to-Cash.", "Customer inquiry or order, sales order, delivery, picking, packing, post goods issue, billing, then accounting entry and customer payment. Each step creates a document linked in the document flow."], ["What is the SD organizational structure?", "Company code, sales organization, distribution channel, division, sales area, sales office, sales group, plant, storage location and shipping point."], ["What is a sales area?", "The combination of sales organization, distribution channel and division. Every sales document is created for one sales area."], ["Which assignments are important in SD?", "Sales org to company code, distribution channel and division to sales org, sales org + distribution channel to plant, plant to company code, and shipping point to plant."], ["What are the main SD master data?", "Customer master (Business Partner in S/4HANA), material master, condition records, customer-material info record, and customer hierarchy."], ["What are partner functions?", "Roles in a sale: sold-to, ship-to, bill-to and payer. They are stored in the customer master and copied into documents."], ["What is a sales document type?", "It controls how a document behaves: number range, default delivery and billing types, item proposal, blocks and partner determination. Example: OR standard order."], ["What is an item category and a schedule line category?", "Item category controls how a line item behaves (delivery and billing relevance, pricing). Schedule line category controls the delivery line (availability check, MRP, movement type)."], ["What is the condition technique?", "The method used to find prices and other data: condition tables, access sequences, condition types and the pricing procedure."], ["What is document flow?", "The chain of linked documents (quotation, order, delivery, billing, accounting) with statuses. Stored in table VBFA and shown with the Document Flow button."], ["What is PGI?", "Post Goods Issue confirms goods left the warehouse. It reduces stock and posts cost of goods sold (debit COGS, credit inventory)."], ["What is the difference between a delivery-related and an order-related invoice?", "Delivery-related billing (F2) invoices what was delivered. Order-related billing (F1) invoices what was ordered, regardless of delivery."], ["What is the difference between ECC and S/4HANA for SD?", "S/4HANA uses Business Partner instead of separate customer and vendor masters, a simpler data model (status fields merged, no aggregates), the universal journal (ACDOCA), Fiori apps, and SAP Credit Management."], ["Which T-codes do you use most?", "VA01/VA02/VA03 for orders, VL01N/VL02N for deliveries, VF01/VF02 for billing, VK11 for prices, VA05 for order lists, BP for business partners, and SE16N for table checks."]]}, {"name": "Configuration-Based Questions", "learn": "Explain setup steps clearly, for example creating a new order type, a pricing condition or copy control, naming the SPRO path or T-code and how you tested it.", "simple": "Say what you set up, where, and how you checked it.", "qa": [["How do you create a new sales document type?", "Copy a similar type in VOV8, set the number range (VN01), default delivery and billing types, schedule line and item proposal, then assign it to the sales area (OVAZ), maintain item category determination (VOV4), copy control (VTAA/VTLA/VTFA) and test."], ["How does item category determination work?", "The system uses sales document type + item category group of the material + usage + higher-level item category to find the item category. Maintained in VOV4."], ["How does schedule line category determination work?", "It uses the item category and the MRP type of the material. Maintained in VOV5."], ["How do you configure pricing?", "Create condition tables (V/03), access sequence (V/07), condition type (V/06), add the type to the pricing procedure (V/08), assign it with pricing procedure determination (OVKK), and maintain condition records (VK11)."], ["How does pricing procedure determination work?", "It uses sales area + customer pricing procedure (customer master) + document pricing procedure (document type). Maintained in OVKK."], ["What is copy control and how is it configured?", "Rules for copying from one document to another, with copy requirements, data transfer routines and pricing type. Set in VTAA, VTLA, VTFL and VTFA at header and item level."], ["How do you configure a new delivery type?", "Copy LF in OVL2, set number range, item categories (OVLP), copy requirements and then assign it as default delivery type in the sales document type."], ["How is shipping point determined?", "From the shipping condition of the customer, the loading group of the material, and the delivering plant."], ["How is route determination configured?", "Define routes, then route determination uses country/region of departure, transportation group of the material, shipping condition and destination country/region."], ["How do you configure revenue account determination?", "Maintain the account determination procedure and records in VKOA with chart of accounts, sales org, customer and material account assignment groups, and account key."], ["How do you configure an incompletion procedure?", "Define the procedure and its mandatory fields in OVA2 (per document type, item, schedule line), then assign it so missing data blocks the document."], ["How do you set up output determination?", "In NACE define the output type, condition table, access sequence and procedure, then maintain output condition records (VV31 for orders) and assign print forms."], ["How do you configure credit management in S/4HANA?", "Use SAP Credit Management: set up the credit segment, rules and scoring, and maintain the credit profile in the business partner (UKM_BP). Documents are checked and blocked by the credit check."]]}, {"name": "Scenario-Based Questions", "learn": "Answer with situation, process, configuration, result. Example: 'free sample delivery' means a no-charge order type, item category not relevant for billing, and a delivery.", "simple": "Tell it as a small story: problem, setup, result.", "qa": [["Customer wants free sample delivery. How will you configure it?", "Use a free-of-charge order type (such as FD) with a free item category (TANN) that is not billing relevant. The delivery is created and goods issue posts, but no invoice is created."], ["The client wants a 10% discount for a customer group on all items.", "Create a discount condition type, add it to the pricing procedure, use an access sequence with customer group, and maintain condition records for that group."], ["Customer returns damaged goods. What is the process?", "Create a returns order (RE) with a reason, post a returns delivery and goods receipt into blocked stock, then bill with a credit memo (via credit memo request if needed)."], ["Customer wants an invoice only after delivery is accepted.", "Set a billing block in the order or use a POD (proof of delivery) so billing is only released after confirmation (VLPOD, V.23)."], ["The supplier should ship directly to the customer.", "Use a third-party item category (TAS) with account assignment so the order creates a purchase requisition and PO. After goods receipt and supplier invoice, bill the customer."], ["Stock is kept at the customer's site and billed on use.", "Use the consignment process: consignment fill-up (KB), consignment issue (KE) which triggers billing, consignment returns (KR) and pick-up (KA)."], ["Two company codes of the same group trade with each other.", "Use intercompany sales: the selling company code takes the order, the supplying plant belongs to another company code, and intercompany billing (IV) is posted between them."], ["Customer buys 10 and gets 1 free.", "Use free goods: condition type NA00 with a free-goods determination procedure and a condition record; the system adds a free item automatically."], ["The customer needs a fixed delivery schedule for the year.", "Use a scheduling agreement (LP) with delivery schedule lines; deliveries are created from the due schedule lines."], ["The client wants orders blocked when the customer exceeds the credit limit.", "Activate credit management; the credit check on order/delivery blocks the document and credit staff release it in UKM_CASE or VKM1 (ECC)."], ["The business wants the order to ship the same day it is entered.", "Use a rush order (SO): the delivery is created automatically when the order is saved."]]}, {"name": "Integration Questions", "learn": "Show how SD connects with MM, FI and PP, with examples of what posts where: availability check, PGI postings, billing postings.", "simple": "Explain who talks to whom and when.", "qa": [["How does SD integrate with MM?", "Availability check and stock requirements come from MM stock. PGI posts a goods movement (movement type 601). Third-party sales create purchase requisitions and POs. Returns create goods receipt."], ["What accounting entry does PGI create?", "Debit cost of goods sold, credit inventory. The accounts come from automatic account determination (OBYC) for the movement type."], ["What accounting entry does billing create?", "Debit customer receivable, credit revenue, credit tax. Accounts come from VKOA (revenue) and tax determination."], ["How does SD integrate with FI?", "Billing and PGI post accounting documents. Account determination (VKOA), tax, payment terms and credit management connect SD with FI."], ["How does SD integrate with PP?", "Sales orders create requirements for MRP and production orders. In make-to-order production is linked to the sales order, and delivery happens after the finished goods are produced."], ["How does SD integrate with CO?", "Billing posts to profitability analysis (CO-PA) with value fields from conditions and cost of sales, so margins by customer, product and region can be analyzed."], ["How does SD integrate with EWM?", "The outbound delivery is replicated to EWM as a warehouse request, the warehouse performs picking and packing with warehouse tasks, and goods issue updates the SD delivery."], ["What is availability check (ATP)?", "A check of available stock against requirements, planned receipts and delivery times in the order. It depends on checking group (material) and checking rule, and it confirms quantities and dates."], ["How do you find which GL account was posted for a billing document?", "Open the billing document, go to Accounting (FI document) and check the lines, and use the pricing conditions with account keys together with VKOA records to explain why."], ["How does credit management connect SD and FI?", "The credit check reads the customer's open receivables (FI), open orders and deliveries (SD), and compares it to the credit limit."]]}, {"name": "Troubleshooting Scenarios", "learn": "Show a structured approach: reproduce, check document flow and status, pricing analysis, incompletion, output or IDoc logs, configuration, then fix and verify. Use real examples.", "simple": "Follow the same checklist every time.", "qa": [["Sales order cannot be created: sales area not defined for customer.", "Extend the customer master (Business Partner) to that sales area and check the sales area is valid for the document type (OVAZ)."], ["Price is not found in the order.", "Use pricing analysis in the item conditions to see which table and record was searched. Check the condition record validity, pricing procedure determination (OVKK), the access sequence and requirements."], ["Wrong price or discount in the order.", "Use pricing analysis, check manual conditions, condition exclusion, scales and validity dates, and the pricing date in the order."], ["Delivery cannot be created for an order.", "Check delivery block, credit block, incompletion, schedule line confirmed quantity, shipping point and delivery due list (VL10), and whether the item is delivery relevant."], ["Delivery has no shipping point or route.", "Check shipping condition on the customer, loading group on the material, and plant; and route determination settings for transportation group and zones."], ["Goods issue fails (PGI error).", "Check stock availability (MMBE), batch/serial requirements, posting period (OMSY), storage location, and movement type account determination."], ["Billing document cannot be created.", "Check billing block, incompletion, delivery PGI status, copy control for billing, billing date, and the billing due list (VF04) error log."], ["Error: no account determined (VKOA).", "Find the account assignment groups of customer and material and the account key in the pricing procedure, then maintain the missing VKOA record."], ["Billing document not released to accounting.", "Check the posting block on the billing type or the blocked billing documents list (VFX3) and release; also check accounting interface errors and posting period."], ["Order shows as incomplete.", "Run V.02 or check Edit, Incompletion log in the order. Fill the missing fields or adjust the incompletion procedure (OVA2)."], ["IDoc order failed with status 51.", "Open the IDoc in WE02, read the error message (missing customer, material, sales area, pricing), fix the master data or mapping, and reprocess in BD87."], ["Batch job (billing run) was cancelled.", "Check the job log in SM37, the spool and the application log (SLG1), fix the cause such as locked documents or missing data, then re-run."], ["Output is not generated.", "Check output determination: output condition record exists, access sequence found, partner and medium, processing status in the output screen, and use the determination analysis."]]}, {"name": "End-to-End O2C Explanations", "learn": "Practice telling the full cycle in 2 minutes: documents, T-codes, tables and the finance postings at each step.", "simple": "The whole story from order to cash.", "qa": [["Explain O2C in two minutes.", "A customer sends an inquiry (VA11) and receives a quotation (VA21). The order is entered (VA01) with pricing, availability check and credit check. The delivery is created (VL01N), goods are picked and packed, and PGI (VL02N) reduces stock and posts COGS. Billing (VF01) creates the invoice and posts receivable and revenue to FI. Payment clears the receivable (F-28). Every step is linked in the document flow."], ["Which documents and tables are created at each step?", "Order: VBAK/VBAP/VBEP. Delivery: LIKP/LIPS. Material document at PGI: MKPF/MSEG (MATDOC in S/4HANA). Billing: VBRK/VBRP. Accounting: BKPF/BSEG (ACDOCA in S/4HANA). Links in VBFA."], ["What happens in the system when you save a sales order?", "Pricing runs, availability check confirms schedule lines, credit check is applied, partners and texts are determined, incompletion is checked, and requirements are passed to MRP."], ["What accounting happens at each step?", "Order and delivery create no financial posting. PGI posts debit COGS, credit inventory. Billing posts debit customer, credit revenue and tax. Payment posts debit bank, credit customer."], ["Which configuration objects drive O2C?", "Enterprise structure, document types, item categories, schedule line categories, copy control, pricing procedure, delivery types, shipping point and route determination, billing types, and account determination."], ["What can block the O2C flow?", "Credit block, delivery block, billing block, incompletion, no confirmed quantity, missing stock, missing master data, closed posting period, or missing account determination."], ["How do you check the status of an order?", "Use the Document Flow button and the status tab in VA03, check VBFA, and use VA05 for lists. In S/4HANA, status fields are in the document header and item tables."], ["How do you explain the S/4HANA differences within O2C?", "Business Partner replaces customer master, pricing data sits in PRCD_ELEMENTS, FI posts to the universal journal ACDOCA, material documents in MATDOC, credit management is SAP Credit Management, and Fiori apps support daily tasks."]]}, {"name": "Practical Assignments", "learn": "Practice in a system: create master data, run O2C, configure a new document type and a pricing procedure. Save screenshots and notes as proof of your work.", "simple": "Do it yourself so you can explain it with confidence.", "qa": [["Assignment 1: Run a full O2C cycle.", "Create a customer and material, a condition record for the price, an order, delivery, PGI and invoice. After each step check the document flow and the tables (VBAK, LIKP, VBRK, BKPF)."], ["Assignment 2: Create a custom order type.", "Create ZOR from OR in VOV8 with its own number range, assign to sales area, set item category and schedule line determination, configure copy control, and test the full flow."], ["Assignment 3: Build a pricing procedure.", "Create a procedure with base price, customer discount, freight and tax, assign it in OVKK, create condition records, and check results with pricing analysis."], ["Assignment 4: Configure a free-of-charge process.", "Create an order type and item category that is not billing relevant, run the order and delivery with PGI, and show that no invoice is created."], ["Assignment 5: Test a returns process.", "Create a returns order with a reason, a returns delivery with goods receipt, and a credit memo. Trace the stock and accounting impact."], ["Assignment 6: Troubleshoot five common errors.", "Reproduce and fix: price not found, incomplete order, delivery block, no account determined, and a failed IDoc. Write issue, analysis, fix and result for each."], ["Assignment 7: Third-party and consignment.", "Run a third-party order through PO, goods receipt and billing. Run a consignment cycle with fill-up, issue and return. Compare their document flows."], ["Assignment 8: Build your interview story bank.", "Write five real stories using issue, analysis, fix and result, and practice explaining each in two minutes."]]}], "tcodes": [], "practice": "Do 2 mock interviews, record yourself explaining O2C, and prepare 5 real troubleshooting stories (issue, analysis, fix, result).", "milestone": "Answer any phase 1 to 12 question in under 2 minutes."}]};
const KEY = "sapsd-roadmap-progress-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tid = (p, i) => p.id + "-" + i;
let filter = "all", query = "";

document.getElementById("title").textContent = DATA.title;
document.getElementById("subtitle").textContent = DATA.subtitle;
document.getElementById("note").textContent = DATA.note;

function phaseDone(p){ return p.topics.filter((_, i) => state[tid(p, i)]).length; }

function render(){
  const list = document.getElementById("list");
  const openIds = new Set([...list.querySelectorAll("details.phase[open]")].map(d => d.dataset.id));
  const openG = new Set([...list.querySelectorAll("details.rg[open]")].map(d => d.dataset.g));
  const openQ = new Set([...list.querySelectorAll("details.q[open]")].map(d => d.dataset.q));
  const openT = new Set([...list.querySelectorAll("details.tp[open]")].map(d => d.dataset.t));
  const q = query.toLowerCase();
  let total = 0, done = 0, weeksLeft = 0;
  list.innerHTML = DATA.phases.map(p => {
    const d = phaseDone(p), n = p.topics.length;
    total += n; done += d; if (d < n) weeksLeft += p.weeks;
    const pct = Math.round(d / n * 100);
    const hay = [p.title, ...p.topics.map(t => t.name + " " + t.learn + " " + (t.qa||[]).map(x => x.join(" ")).join(" ")), ...(p.reference||[]).flatMap(g => g[2].map(r => r[0] + " " + r[1])), ...(p.tcodes||[]), ...(p.tables||[])].join(" ").toLowerCase();
    const status = d === n ? "done" : "todo";
    const hidden = (q && !hay.includes(q)) || (filter !== "all" && filter !== status);
    const searching = !!q;
    return `<details class="phase ${d===n?"done":""} ${hidden?"hide":""}" data-id="${p.id}" ${openIds.has(String(p.id))||searching?"open":""}>
      <summary>
        <div class="num">${p.icon}</div>
        <div class="ph-main"><div class="ph-title">${p.id}. ${esc(p.title)}</div>
          <div class="meta"><span class="lvl">${p.level}</span>${p.weeks} wk · ${d}/${n} topics</div></div>
        <div class="mini">${pct}%</div>
      </summary>
      <div class="body">
        <p class="goal">🎯 ${esc(p.goal)}</p>
        <h3>What to learn</h3>
        ${p.topics.map((t, i) => `<div class="topic ${state[tid(p,i)]?"checked":""}"><input type="checkbox" data-k="${tid(p,i)}" ${state[tid(p,i)]?"checked":""} aria-label="Mark done"><details class="tp" data-t="${tid(p,i)}" ${openT.has(tid(p,i))||searching?"open":""}><summary>${esc(t.name)}</summary><p class="learn">${esc(t.learn)}</p><p class="simple">💬 <b>In simple words:</b> ${esc(t.simple)}</p>${(t.qa||[]).length ? `<div class="qa"><h3>Q and A</h3>${t.qa.map((x, qi) => `<details class="q" data-q="${tid(p,i)}-${qi}" ${openQ.has(tid(p,i)+"-"+qi)?"open":""}><summary>${esc(x[0])}</summary><p>${esc(x[1])}</p></details>`).join("")}</div>` : ""}</details></div>`).join("")}
        ${p.tcodes && p.tcodes.length ? `<h3>Key T-codes</h3><div class="chips">${p.tcodes.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>` : ""}
        ${p.tables && p.tables.length ? `<h3>Key tables</h3><div class="chips">${p.tables.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>` : ""}
        ${(p.reference||[]).map((g, gi) => { const rows = g[2].filter(r => !q || (r[0] + " " + r[1]).toLowerCase().includes(q)); if (!rows.length) return ""; return `<details class="rg" data-g="${p.id}-${gi}" ${q||openG.has(p.id+"-"+gi)?"open":""}><summary>${esc(g[0])} · ${esc(g[1])} <small>(${rows.length})</small></summary><div class="ref">${rows.map(r => `<div class="r"><span class="chip">${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join("")}</div></details>`; }).join("")}
        <h3>Hands-on practice</h3><div class="box">${esc(p.practice)}</div>
        <h3>Milestone</h3><div class="box">✅ ${esc(p.milestone)}</div>
      </div>
    </details>`;
  }).join("");
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById("fill").style.width = pct + "%";
  document.getElementById("count").textContent = `${done}/${total} topics · ${pct}%`;
  document.getElementById("weeks").textContent = weeksLeft ? `~${weeksLeft} weeks left` : "All done 🎉";
}

document.getElementById("list").addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k) return;
  if (e.target.checked) state[k] = 1; else delete state[k];
  save(); render();
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
document.getElementById("seg").addEventListener("click", e => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b === e.target));
  render();
});
let allOpen = false;
document.getElementById("expand").onclick = e => {
  allOpen = !allOpen;
  document.querySelectorAll("details.phase").forEach(d => d.open = allOpen);
  e.target.textContent = allOpen ? "Collapse all" : "Expand all";
};
document.getElementById("reset").onclick = () => {
  if (confirm("Clear all progress?")) { state = {}; save(); render(); }
};
document.getElementById("export").onclick = () => {
  const lines = DATA.phases.map(p => `${p.id}. ${p.title}: ${phaseDone(p)}/${p.topics.length}`);
  const blob = new Blob([lines.join("\n")], {type: "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "sap-sd-progress.txt"; a.click();
};
render();
</script>
</body>
</html>
